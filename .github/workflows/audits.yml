name: Audits

# The five standing audits, run on every push and PR.
#
# WHY THIS WORKFLOW EXISTS. Each of these checks a boundary no other gate can
# see, and none of them was wired into CI — `tools/audits/README.md` said "in
# CI, on every commit" while the answer was "when somebody remembers". The cost
# of that was measured on 2026-08-12: `observer-parity.sh` was sitting RED with
# three unclassified findings (`FakeNpcDialogAnchorPacket`, `GmKickResponsePacket`,
# `TalkieBoxMessagePacket`) introduced by the typed-no-op batch, and two of the
# three turned out to be dropped features with a stated reason that did not
# survive checking. The audit had already found them; nothing was running it.
#
# These are static checks: no server, no GPU, no database. The whole job is
# seconds of work plus a checkout, which is why "run it on everything" is the
# right setting rather than a nightly.
#
# An audit here passes when every hit is CLASSIFIED, not when it returns
# nothing. A red run means "something new appeared that nobody has triaged" —
# triage it and either fix it or baseline it with a rationale. Never silence one
# by deleting the hit.

on:
  # Weekly is the load-bearing trigger, not a backstop.
  #
  # Push and pull_request only fire for `main`, and the work in this fork lives
  # on long-running agent branches — the audits reached CI at all on 2026-08-12
  # only because a draft PR happened to be open. Close that PR, or work on a
  # branch without one, and every trigger below except this cron goes quiet
  # while the tree keeps changing. These checks are also the ones whose subject
  # moves without a commit here: the pinned Hercules revision, the runner image,
  # and the toolchain.
  #
  # Monday morning UTC, off the hour to miss GitHub's scheduling congestion, and
  # clear of the nightly paired-integration slot (08:23).
  #
  # ONE THING MUST STILL BE DONE FOR THIS TO EVER FIRE: GitHub reads `schedule`
  # only from the **default branch**, so this file has to exist on `main`.
  # Today it does not, and neither does `integration.yml` — which means that
  # workflow's `cron: "23 8 * * *"` has never run either, despite the testing
  # docs describing the nightly full-suite run as an arrangement in force.
  # A scheduled cron on a non-default branch is silent, not an error.
  schedule:
    - cron: "17 7 * * 1"
  push:
    branches: [ main ]
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Not cancel-in-progress for a scheduled run: the weekly one is the only run
  # some weeks get, and losing it to a push that arrives mid-flight would make
  # the cadence a lie.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  audits:
    name: Standing audits
    runs-on: ubuntu-latest

    steps:
      # **A scheduled run has to be told which branch to audit.**
      #
      # GitHub only fires `schedule` from the default branch, and it checks out
      # the default branch by default. Here that is `main`, which is 246 commits
      # behind this fork's actual trunk and contains no `tools/audits/` at all —
      # so the weekly run would check out a tree with nothing to audit and pass
      # by having nothing to do, which is the worst outcome available.
      #
      # Named literally rather than inferred, so it is greppable and so a wrong
      # value fails the checkout loudly instead of auditing the wrong tree.
      # Update it when the fork's trunk branch changes.
      - name: Check out Korangar
        uses: actions/checkout@v4
        with:
          path: korangar
          ref: ${{ github.event_name == 'schedule' && 'agent/platform-connectivity-controls' || github.ref }}

      # Three observer-parity audits (A4, A5, A8) read Hercules' own source, and
      # all four generated files are generated FROM Hercules data. Without this
      # checkout they self-skip and the job would report green while checking
      # half of what it claims to.
      - name: Resolve the paired Hercules revision
        id: hercules
        working-directory: korangar
        run: echo "revision=$(tr -d '[:space:]' < tools/testing/hercules-revision)" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned Hercules
        uses: actions/checkout@v4
        with:
          repository: Boneysan/Hercules
          ref: ${{ steps.hercules.outputs.revision }}
          path: Hercules

      # `generate_skill_states.py` and `generate_skill_expectations.py` rustfmt
      # their own output, so this needs not just *a* rustfmt but the one the
      # repo pins.
      #
      # It has to be installed explicitly, and the reason is worth stating: this
      # job checks the repo out into `korangar/`, so `$GITHUB_WORKSPACE` has no
      # `rust-toolchain.toml` and a bare `rustup component add rustfmt` there
      # attaches rustfmt to the runner's default **stable**. The other workflows
      # get away with it only because they check out to the workspace root.
      #
      # Stable rustfmt does not reject the nightly-only options in
      # `rustfmt.toml` — it warns and formats without them — so the first run of
      # this workflow reported two generated files as DRIFTED with entirely
      # convincing diffs, against a Hercules checkout identical to the pinned
      # revision. `generated-drift.sh` now probes for this and refuses to run
      # rather than blaming the data; this step is what stops it coming up.
      - name: Install the pinned toolchain with rustfmt
        working-directory: korangar
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "rust-toolchain.toml pins: $channel"
          rustup toolchain install "$channel" --component rustfmt --profile minimal
          rustfmt --version

      - name: Observer parity (A1–A9, B2a–B2c)
        working-directory: korangar
        env:
          HERCULES_DIR: ${{ github.workspace }}/Hercules
        run: ./tools/audits/observer-parity.sh

      - name: Generated files still match their generators
        working-directory: korangar
        env:
          HERCULES_DIR: ${{ github.workspace }}/Hercules
        run: ./tools/audits/generated-drift.sh

      - name: Client registers the live PACKETVER header
        working-directory: korangar
        env:
          HERCULES_DIR: ${{ github.workspace }}/Hercules
        run: python3 tools/audits/packetver-variants.py

      - name: No server event is discarded outright
        working-directory: korangar
        run: python3 tools/audits/event-routing.py

      - name: No state is stored and never read
        working-directory: korangar
        run: python3 tools/audits/unread-state.py
